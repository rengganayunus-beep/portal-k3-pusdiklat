<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Masuk · Portal K3 Pusdiklat</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A4595">
<meta name="apple-mobile-web-app-title" content="Portal K3">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{
  color-scheme:light;--bg:#0A4595;--card:#FFFFFF;--ink:#1E293B;--ink2:#475569;--line:#DBE2EA;--accent:#0A4595;--accent-ink:#fff;--signal:#FFB800;--dev:#B45309;--dev-soft:#FEF3E2
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);font-family:'Source Sans 3',system-ui,sans-serif;color:var(--ink);display:grid;place-items:center;padding-inline:16px}
.card{background:var(--card);border-radius:12px;padding:32px 28px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:16px;text-align:center}
.card svg{width:44px;height:44px;margin:0 auto;color:var(--accent)}
h1{font-family:'Barlow Semi Condensed','Arial Narrow',sans-serif;font-size:30px;margin:0;line-height:1.1}
p{margin:0;color:var(--ink2);font-size:15px;line-height:1.55}
.badge{align-self:center;font-size:12px;font-weight:700;padding:4px 12px;border-radius:20px;background:var(--dev-soft);color:var(--dev)}
a.btn{display:inline-flex;justify-content:center;align-items:center;min-height:46px;border-radius:6px;background:var(--accent);color:var(--accent-ink);font-weight:700;text-decoration:none}
a.btn:focus-visible{outline:2px solid var(--signal);outline-offset:3px}
</style>
</head>
<body>
<main class="card">
  <svg viewBox="0 0 28 28" aria-hidden="true"><path d="M14 2 25 6.5v7.2c0 6.3-4.6 11.2-11 12.3C7.6 24.9 3 20 3 13.7V6.5L14 2Z" fill="none" stroke="currentColor" stroke-width="2"/><rect x="9.5" y="12.5" width="9" height="7" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M11.5 12.5v-2a2.5 2.5 0 0 1 5 0v2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
  <span class="badge">Khusus pengguna terdaftar</span>
  <h1>Masuk ke Portal K3</h1>
  <p>Anda akan diminta login dengan akun Google. Dashboard hanya terbuka untuk email yang sudah didaftarkan Tim K3L &amp; KAM. Saat pertama kali masuk, Google akan meminta izin untuk membaca alamat email Anda.</p>
  <a class="btn" href="https://script.google.com/macros/s/AKfycby1Ayua8Jqd6UJPuzB9QifTZSqlM53n0EaTva_J8Wb_OiDRdAAQbt7TVWLZ2qyyVOHKZA/exec" target="_top">Masuk dengan akun Google</a>
  <a href="index.html" style="font-size:14px;color:var(--ink2)">Kembali ke beranda</a>
</main>
</body>
</html>
